<h3>Course Summary</h3>

<p>Total Courses: {{ courseCount }}</p>

<button type="button" (click)="addSampleCourse()">
  Add Sample Course
</button>

<button type="button" (click)="updateFirstCourse()">
  Update First Course
</button>

<button type="button" (click)="deleteLastCourse()">
  Delete Last Course
</button>

<p *ngIf="message">
  {{ message }}
</p>
