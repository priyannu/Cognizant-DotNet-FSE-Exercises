<h2>Student Profile</h2>

<h3>Enrolled Courses</h3>

<p *ngIf="isLoading">
  Loading enrolled courses...
</p>

<p *ngIf="errorMessage">
  {{ errorMessage }}
</p>

<ul *ngIf="!isLoading && enrolledCourses.length > 0">
  <li *ngFor="let course of enrolledCourses">
    {{ course.name }} - {{ course.code }}
  </li>
</ul>

<p *ngIf="!isLoading && enrolledCourses.length === 0">
  No courses enrolled.
</p>
