<h2>Course Details</h2>

<div *ngIf="course; else courseNotFound">
  <h3>{{ course.name }}</h3>

  <p><strong>ID:</strong> {{ course.id }}</p>
  <p><strong>Code:</strong> {{ course.code }}</p>
  <p><strong>Credits:</strong> {{ course.credits }}</p>
  <p><strong>Status:</strong> {{ course.gradeStatus }}</p>
</div>

<ng-template #courseNotFound>
  <h3>404 - Course Not Found</h3>

  <p>The requested course does not exist.</p>
</ng-template>

<br />

<a routerLink="/courses">Back to Courses</a>
