<h2>Reactive Student Enrollment Form</h2>

<form [formGroup]="enrollForm" (ngSubmit)="onSubmit()">

  <label>Student Name</label><br>
  <input type="text" formControlName="studentName"><br>

  <span *ngIf="enrollForm.get('studentName')?.touched &&
               enrollForm.get('studentName')?.errors?.['required']">
    Name is required
  </span>

  <span *ngIf="enrollForm.get('studentName')?.touched &&
               enrollForm.get('studentName')?.errors?.['minlength']">
    Name must be at least 3 characters
  </span>

  <br><br>

  <label>Student Email</label><br>
  <input type="email" formControlName="studentEmail"><br>

  <span *ngIf="enrollForm.get('studentEmail')?.errors?.['emailTaken']">
    Email already taken
  </span>

  <br><br>

  <label>Course ID</label><br>
  <input type="text" formControlName="courseId"><br>

  <span *ngIf="enrollForm.get('courseId')?.errors?.['noCourseCode']">
    Course code starting with XX is not allowed.
  </span>

  <br><br>

  <label>Preferred Semester</label><br>

  <select formControlName="preferredSemester">
    <option>Odd</option>
    <option>Even</option>
  </select>

  <br><br>

  <input type="checkbox" formControlName="agreeToTerms">
  Agree To Terms

  <br><br>

  <h3>Additional Courses</h3>

  <button type="button" (click)="addCourse()">
    Add Another Course
  </button>

  <br><br>

  <div
    *ngFor="let ctrl of additionalCourses.controls; let i = index"
  >
    <input [formControl]="ctrl">

    <button
      type="button"
      (click)="removeCourse(i)">
      Remove
    </button>

    <br><br>
  </div>

  <button
    type="submit"
    [disabled]="enrollForm.invalid">
    Submit
  </button>

</form>
