<h2>Available Courses</h2>

<p *ngIf="loading$ | async">
  Loading courses...
</p>

<p *ngIf="error$ | async as error">
  {{ error }}
</p>

<div
  *ngFor="let course of (courses$ | async); trackBy: trackByCourseId"
>

  <app-course-card
    [course]="course"
    (enrollRequested)="onEnroll($event)">
  </app-course-card>

  <button
    type="button"
    (click)="loadStudents(course)">
    Load Enrolled Students
  </button>

  <section *ngIf="selectedCourseId === course.id">

    <h3>
      Enrolled Students — {{ selectedCourseName }}
    </h3>

    <p *ngIf="studentMessage">
      {{ studentMessage }}
    </p>

    <ul *ngIf="enrolledStudents.length > 0">

      <li *ngFor="let student of enrolledStudents">

        {{ student.name }}

        <span *ngIf="student.email">
          — {{ student.email }}
        </span>

      </li>

    </ul>

  </section>

  <br><br>

</div>
