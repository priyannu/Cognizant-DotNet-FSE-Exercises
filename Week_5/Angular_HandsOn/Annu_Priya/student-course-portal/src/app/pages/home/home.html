<h1>{{ portalName }}</h1>

<p>
  Manage your courses, monitor your academic progress, and access your profile information from one place.
</p>

<button
  [disabled]="!isPortalActive"
  (click)="onEnrollClick()">
  Enroll Now
</button>

<p>{{ message }}</p>

<br>

<label>Search Course:</label>

<input
  type="text"
  [(ngModel)]="searchTerm"
  (input)="onSearch()"
  placeholder="Enter course name">

<p>Searching for: {{ searchTerm }}</p>

<h3>Statistics</h3>

<ul>
  <li>Courses Available: {{ availableCourses }}</li>
  <li>Enrolled: 3</li>
  <li>GPA: 3.8</li>
</ul>

<hr>

<app-course-summary-widget></app-course-summary-widget>

<hr>

<app-notification></app-notification>
